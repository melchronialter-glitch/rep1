name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Test and build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Create SHA-256 manifest
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: aster-room-rosytalk-bridge-v0.4-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
